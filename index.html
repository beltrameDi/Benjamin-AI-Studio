<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pensa Rapido</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @keyframes fly-in-from-left {
        from {
          transform: translateX(-150%) rotate(-30deg);
          opacity: 0;
        }
        to {
          transform: translateX(0) rotate(0deg);
          opacity: 1;
        }
      }
      @keyframes fly-in-from-right {
        from {
          transform: translateX(150%) rotate(30deg);
          opacity: 0;
        }
        to {
          transform: translateX(0) rotate(0deg);
          opacity: 1;
        }
      }
      .animate-fly-in-left {
        animation: fly-in-from-left 0.4s ease-out;
      }
      .animate-fly-in-right {
        animation: fly-in-from-right 0.4s ease-out;
      }

      @keyframes fade-in-up {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .intro-title {
        animation: fade-in-up 1s ease-out forwards;
      }
      .intro-subtitle {
        animation: fade-in-up 1s ease-out 0.5s forwards;
        opacity: 0; /* Start hidden */
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
</head>

    <div id="root"></div>
    <audio id="background-music" loop src="https://www.chosic.com/wp-content/uploads/2021/04/purrple-cat-equinox.mp3" crossorigin="anonymous"></audio>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
